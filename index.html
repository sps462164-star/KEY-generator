<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Key Store</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        select { background: #334155; color: #fff; }
        button { background: #22c55e; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        #qrcode { background: #fff; padding: 15px; display: inline-block; border-radius: 8px; margin-top: 15px; }
        .price { font-size: 22px; color: #38bdf8; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VIP Key Store</h2>
        <p>Select your plan:</p>
        
        <select id="planSelect" onchange="updatePayment()">
            <option value="70">1 Day - ₹70</option>
            <option value="150">3 Days - ₹150</option>
            <option value="300">7 Days - ₹300</option>
            <option value="800">30 Days - ₹800</option>
        </select>

        <div class="price" id="priceDisplay">Amount: ₹70</div>

        <div id="qrcode"></div>

        <p style="font-size: 14px; color: #94a3b8; margin-top: 15px;">Scan using any UPI App (Paytm, PhonePe, GPay)</p>
    </div>

    <script>
        // आपकी असली मर्चेंट यूपीआई आईडी और नाम
        const upiId = "paytm.s3ozvzu@pty";
        const payeeName = "Robin Kumar";

        function updatePayment() {
            const amount = document.getElementById("planSelect").value;
            document.getElementById("priceDisplay").innerText = "Amount: ₹" + amount;

            // UPI String formatting
            const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;

            // Clear old QR code
            document.getElementById("qrcode").innerHTML = "";

            // Generate new QR code
            try {
                var qr = qrcode(0, 'M');
                qr.addData(upiUrl);
                qr.make();
                document.getElementById("qrcode").innerHTML = qr.createImgTag(5);
            } catch (e) {
                console.error("QR Generation failed", e);
            }
        }

        // Initial load
        window.onload = updatePayment;
    </script>

</body>
</html>
